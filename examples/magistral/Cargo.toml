[package]
name = "magistral"
version = "0.1.0"
edition = "2021"
publish = false

# The game is its own workspace: editing it rebuilds the game, never the
# engine. The rules are a crate of their own, without the engine, so the
# depth report builds and runs in seconds.
[workspace]
members = ["rules"]

[dependencies]
anyhow = "1"
magistral-rules = { path = "rules" }
scrap = { package = "scrap-engine", path = "../../crates/scrap", default-features = false, features = ["desktop-shell"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# The rules too: the hint is a tree search of hundreds of games.
[profile.dev.package.magistral-rules]
opt-level = 3

[profile.release]
debug = "line-tables-only"

# In the browser: its randomness, a panic said in the console (web/build.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
# The screenshot test writes what the game looks like as PNG.
image = { version = "0.25.9", default-features = false, features = ["png"] }

# The site: small, and still fast (web/build.sh).
[profile.web]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
