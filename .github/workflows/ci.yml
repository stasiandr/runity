name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test runs without a display: the X11 backend is exercised against
      # a fake X server, and rendering goes to an in-memory framebuffer.
      - name: Test
        run: cargo test --workspace
      - name: Render a frame headlessly
        run: cargo run --release --example spinning_cube
        env:
          RUNITY_HEADLESS: "1"

  cross-check:
    name: cross-check every backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Backends that cannot be built on the host still get type-checked.
        target: [aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings
