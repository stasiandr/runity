name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # A frame has to be renderable on a machine with no graphics card,
      # because that is what CI is and what an agent's loop runs on. Mesa's
      # lavapipe is a software Vulkan device; wgpu picks it up like any other
      # adapter. macOS always has Metal, and Windows has WARP.
      - name: Install a software Vulkan device
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The window shell is behind a feature, so a plain clippy run never
      # sees it. It is the one part of the engine CI cannot execute — no
      # runner has a display — so type-checking it is all the safety net
      # there is, and it has to be deliberate.
      - name: Clippy (desktop shell)
        run: cargo clippy --workspace --all-targets --features desktop-shell -- -D warnings
      - name: Test
        run: cargo test --workspace
