name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # A software Vulkan device, because a frame has to be renderable on a
      # machine with no graphics card — which is what CI is and what an
      # agent's loop runs on. macOS always has Metal, Windows has WARP.
      #
      # ALSA and dbus headers because cpal needs them to build at all on
      # Linux, sound card or not. The mixer's tests use kira's mock backend
      # and never open a device.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers libasound2-dev libdbus-1-dev libudev-dev

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The window shell is behind a feature, so a plain clippy run never
      # sees it. It is the one part of the engine CI cannot execute — no
      # runner has a display — so type-checking it is all the safety net
      # there is, and it has to be deliberate.
      - name: Clippy (desktop shell)
        run: cargo clippy --workspace --all-targets --features desktop-shell -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Fast and medium tests (.config/nextest.toml); the slow ones run once
      # a day (daily.yml). nextest does not run doctests, so they go apart.
      - name: Test
        run: cargo nextest run --workspace -P ci
      - name: Doctests
        run: cargo test --workspace --doc
      # Sound is behind a feature and off by default — the engine is built on
      # greybox and nobody is listening yet. Tested here anyway, with kira's
      # mock backend, so that the day it is turned back on it still works.
      - name: Test (audio)
        run: cargo nextest run --workspace -P ci --features scrap/audio
      # "Switching a subsystem off is one line" is only true while the engine
      # still builds with it off. Checked here, because nothing else builds
      # the engine bare and the first to notice would be a game that tried.
      - name: Check (no optional subsystems)
        run: cargo check -p scrap-engine --no-default-features
      # The web is not closed (DNA): the bare core builds for the browser —
      # no Instant, no clock, no threads of its own, data through a seam.
      - name: The bare core builds for the web
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p scrap-core --target wasm32-unknown-unknown
      # The Steam transport links Valve's SDK and needs the client to run,
      # so it is only built here; nothing can exercise it on a runner.
      - name: Clippy (steam)
        run: cargo clippy -p scrap-engine --features steam -- -D warnings
      # `scrap check` over the example: every model, material and prefab
      # its scenes name resolves, and every sidecar is current.
      - name: Check the example project
        run: cargo run -q -p scrap-cli -- check examples/valley
      # And the gallery of graphs: every shader, effect and fullscreen graph
      # built as the renderer would (docs/shadergraph.md).
      - name: Check the graphs example
        run: cargo run -q -p scrap-cli -- check examples/graphs
      # The example's frames against their budgets (examples/valley/
      # budgets.ron, DNA postulate 6): its library built, every scene drawn
      # offscreen, its draws and triangles held. Not its GPU time: a shared
      # runner's GPU (or software renderer) is not the one the budgets were
      # set on; `scrap perf` without --counts holds that on a machine that
      # is.
      - name: The example's frames within budget
        run: |
          cargo run -q -p scrap-cli -- sync examples/valley
          cargo run -q -p scrap-cli -- perf examples/valley --frames 2 --counts
      # What `scrap new` makes has to build against the engine it came
      # with: a template that rots is the first thing a new project meets.
      # And how long it takes to rebuild after a one-line edit is DNA
      # postulate 1's number: measured on every commit, with a budget. Loose,
      # for a shared runner; it is ~0.8 s on a developer machine.
      - name: A new project checks clean, builds, and rebuilds within budget
        shell: bash
        run: |
          cargo run -q -p scrap-cli -- new "$RUNNER_TEMP/fresh" --engine-path crates/scrap
          cargo run -q -p scrap-cli -- check "$RUNNER_TEMP/fresh"
          cp Cargo.lock "$RUNNER_TEMP/fresh/"
          CARGO_TARGET_DIR="$PWD/target" cargo run -q -p scrap-cli -- rebuild-time "$RUNNER_TEMP/fresh" --budget 10
          CARGO_TARGET_DIR="$PWD/target" cargo run -q -p scrap-cli -- build "$RUNNER_TEMP/fresh" --debug --out "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/data/content/fresh/maps/main.scene.ron"
      # The other ways to start (DNA, postulate 8): the bare core — a game
      # with no window, on scrap-core alone — and a template, an example
      # copied and handed over. Each builds and plays its start scene.
      - name: A bare project and a template build and play
        shell: bash
        run: |
          cargo run -q -p scrap-cli -- new "$RUNNER_TEMP/bare" --set bare --engine-path crates/scrap
          cargo run -q -p scrap-cli -- check "$RUNNER_TEMP/bare"
          (cd "$RUNNER_TEMP/bare" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo test)
          cargo run -q -p scrap-cli -- new "$RUNNER_TEMP/soup" --template kitchen --engine-path crates/scrap
          (cd "$RUNNER_TEMP/soup" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo check --tests)
