name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Every test runs without a display: the X11 backend is exercised against
      # a fake X server, and rendering goes to an in-memory framebuffer.
      - name: Test
        run: cargo test --workspace
      # A failing golden-image test leaves the rendered frame and the diff
      # next to the reference; they are the whole point of the test.
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: |
            **/*.actual.png
            **/*.diff.png
          if-no-files-found: ignore

      - name: Render a frame headlessly
        run: cargo run --release --example spinning_cube
        env:
          RUNITY_HEADLESS: "1"

      # The example asserts that a save survives a round trip, that a loaded
      # world lives the next year identically, and that one seed always grows
      # the same village. Running it here keeps those claims honest.
      - name: Simulate a village
        run: cargo run --release --example settlement
        env:
          RUNITY_YEARS: "4"

      - name: Simulate and render physics headlessly
        run: cargo run --release --example physics_playground
        env:
          RUNITY_HEADLESS: "1"

      - name: Walk around in first person
        run: cargo run --release --example first_person
        env:
          RUNITY_HEADLESS: "1"
          RUNITY_WIDTH: "320"
          RUNITY_HEIGHT: "180"

      # No renderer involved: it walks a listener past the village and writes
      # what it would have sounded like, asserting the panning on the way.
      - name: Record a soundscape
        run: cargo run --release --example soundscape

      # Small, because the point is that the AI runs end to end — terrain to
      # navigation to decisions — not that the frame looks good.
      - name: Run the foragers
        run: cargo run --release --example foragers
        env:
          RUNITY_HEADLESS: "1"
          RUNITY_WIDTH: "320"
          RUNITY_HEIGHT: "180"

  cross-check:
    name: cross-check every backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Backends that cannot be built on the host still get type-checked.
        target: [aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings
