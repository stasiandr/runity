[package]
name = "runity-render"
description = "runity's 3D render: the scene drawn on the GPU — materials and lights, shadows, sky and fog, post-processing, particles, terrain, foliage and gizmos — from what the world's entities look like."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
runity-core = { path = "../runity-core" }
runity-geometry = { path = "../runity-geometry" }
runity-gpu = { path = "../runity-gpu" }
runity-overlay = { path = "../runity-overlay" }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"
pollster = "1.0.1"
rkyv = { version = "0.8", features = ["bytecheck"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "30"

# MetalFX, Apple's upscaler (`upscale`): reached through wgpu's Metal
# handles, so only on Apple's systems, and only with the `metalfx` feature.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
objc2-metal-fx = { version = "0.3.2", features = ["MTLFXSpatialScaler", "MTLFXTemporalScaler"], optional = true }

[features]
default = ["metalfx", "ray-tracing"]
# Hardware ray tracing, where the device has it: an experiment. Off, the
# code and the shader are not in the build, and the lit pass runs as on a
# device without rays.
ray-tracing = []
# MetalFX temporal and spatial upscaling on Apple's GPUs. Off (or on any
# other system), upscaling is the engine's own Catmull-Rom.
metalfx = ["dep:objc2", "dep:objc2-metal", "dep:objc2-metal-fx"]
