[package]
name = "runity-render"
description = "runity's 3D render: the scene drawn on the GPU — materials and lights, shadows, sky and fog, post-processing, particles, terrain, foliage and gizmos — from what the world's entities look like."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
runity-core = { path = "../runity-core" }
runity-geometry = { path = "../runity-geometry" }
runity-gpu = { path = "../runity-gpu" }
runity-overlay = { path = "../runity-overlay" }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"
pollster = "1.0.1"
rkyv = { version = "0.8", features = ["bytecheck"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "30"

[features]
default = ["ray-tracing"]
# Hardware ray tracing, where the device has it: an experiment. Off, the
# code and the shader are not in the build, and the lit pass runs as on a
# device without rays.
ray-tracing = []
