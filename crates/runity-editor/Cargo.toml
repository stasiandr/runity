[package]
name = "runity-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The editor's session: a document open for editing, and everything a person
# does to it — select, drag, undo, import, play. No UI and no window: the
# GPUI shell draws panels on top of this, and anything else that wants to
# edit a scene (a test, an agent, a command line) calls the same functions.
# It links the importer, which the game never does.
[dependencies]
hecs = "0.11.0"
runity = { version = "0.1.0", path = "../runity" }
runity-import = { version = "0.1.0", path = "../runity-import" }

[dev-dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }

# Renders a scene with the gizmo on the selection, headlessly, to a PNG.
[[example]]
name = "gizmo_shot"
path = "examples/gizmo_shot.rs"
