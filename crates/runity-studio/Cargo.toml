[package]
name = "runity-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The editor's window: runity-ui panels over `runity-editor`'s session.
#
# Nothing here decides what an edit means — that is the session's, and the
# same functions answer to a test and to an agent over MCP (DNA, postulate
# 5). This crate owns the layout, the panels and the routing of input. The
# window is a thin winit loop around `Studio`, which runs headless as well:
# the tests and the `shot` example drive it with no screen.
[dependencies]
arboard = { version = "3", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
runity = { version = "0.1.0", path = "../runity", features = ["desktop-shell", "audio"] }
runity-cli = { version = "0.1.0", path = "../runity-cli" }
runity-editor = { version = "0.1.0", path = "../runity-editor" }
runity-import = { version = "0.1.0", path = "../runity-import" }
runity-ui = { version = "0.1.0", path = "../runity-ui" }
wgpu = "30"
winit = "0.30.13"

[dev-dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }

[[example]]
name = "shot"
path = "examples/shot.rs"

[[bin]]
name = "runity-studio"
path = "src/main.rs"
