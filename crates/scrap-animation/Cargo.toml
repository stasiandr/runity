[package]
name = "scrap-animation"
description = "scrap's animation: skeletons posed from clips, animator graphs with their states and transitions, and motion clips that move a scene's things. Plays geometry's skeletons and clips; draws nothing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
scrap-core = { path = "../scrap-core" }
scrap-geometry = { path = "../scrap-geometry" }
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
