[package]
name = "scrap-shell"
description = "scrap's desktop shell: a plain window on winit, gamepads on Apple's GameController (macOS, iOS) or gilrs (elsewhere), the fixed step and the frame, hot patches through subsecond. The convenience path for running a game without the editor; the engine does not need it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
scrap-core = { path = "../scrap-core" }
scrap-gpu = { path = "../scrap-gpu", features = ["winit"] }
scrap-overlay = { path = "../scrap-overlay" }
scrap-render = { path = "../scrap-render" }
# The game's own UI tree — screens in HTML among it — drawn over the frame.
scrap-ui = { path = "../scrap-ui" }
anyhow = "1.0.104"
glam = "0.32"
gilrs = "0.11"
subsecond = "0.7.10"
winit = "0.30.13"
# The control socket's wire (SCRAP_CONTROL): JSON lines, events as a
# script names them, shots as PNG.
serde_json = "1"
ron = "0.12.2"
image = { version = "0.25.9", default-features = false, features = ["png"] }
# The control socket's scripts (`script`): Rhai — pure Rust, sandboxed
# (no files, network or processes unless given), errors with lines,
# values to and from serde (docs/world-control.md, "Why Rhai").
rhai = { version = "1.23", default-features = false, features = ["std", "serde", "no_custom_syntax"] }

# On Android: the Activity's loop (NativeActivity: no Java to build),
# logcat for what the game prints and what wgpu warns of.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
libc = "0.2"
log = "0.4"

# On macOS and iOS: gamepads through Apple's GameController framework
# (`pads::apple`) — the system's game-controller daemon owns a DualSense
# over Bluetooth, and IOKit (gilrs) gets no reports from it; its light,
# haptics (CoreHaptics), adaptive triggers, touchpad, motion and battery.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSDictionary", "NSEnumerator", "NSSet", "NSNotification", "NSOperation", "NSDate", "NSRunLoop", "NSError", "NSValue", "NSObjCRuntime", "block2"] }
objc2-game-controller = { version = "0.3.2", default-features = false, features = ["std", "dispatch2", "block2", "GCController", "GCExtendedGamepad", "GCMicroGamepad", "GCDualSenseGamepad", "GCDualShockGamepad", "GCXboxGamepad", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerAxisInput", "GCControllerElement", "GCDevice", "GCDeviceLight", "GCColor", "GCDeviceHaptics", "GCDeviceBattery", "GCDualSenseAdaptiveTrigger", "GCPhysicalInputProfile", "GCMotion", "GCProductCategories"] }
objc2-core-haptics = { version = "0.3.2", default-features = false, features = ["std", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer"] }

# On iOS: the scene delegate UIKit asks for (`ios`).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIResponder", "UIScene", "UISceneOptions", "UISceneSession", "UIView", "UIWindow", "UIWindowScene"] }

# In the browser: the canvas, the page's clock, the device awaited.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "HtmlCanvasElement", "Performance", "Window"] }

[dev-dependencies]
# A test's picture of the Frame Debugger's window, to look at.
image = { version = "0.25.9", default-features = false, features = ["png"] }
scrap-geometry = { path = "../scrap-geometry" }
