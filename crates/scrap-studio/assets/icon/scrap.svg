<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- scrap: a cube put together from mismatched plates; the last one is
       still on its way into its socket. Master for 48 px and up;
       scrap-small.svg draws the same for 16-32 px. -->
  <rect width="64" height="64" rx="14" fill="#161826"/>
  <g transform="translate(32 32.5) scale(1.04) translate(-32 -29.5)"
     stroke="#161826" stroke-width="1.6" stroke-linejoin="round">
    <!-- left face: two plates -->
    <path d="M15 25 L32 35 L32 45 L15 35Z" fill="#7a6ec4"/>
    <path d="M15 35 L32 45 L32 55 L15 45Z" fill="#5f54a8"/>
    <!-- right face: a plate and a copper patch -->
    <path d="M32 35 L40.5 30 L40.5 50 L32 55Z" fill="#4b4190"/>
    <path d="M40.5 30 L49 25 L49 45 L40.5 50Z" fill="#c98a5b"/>
    <!-- top: three quarters plated, the back one an empty socket -->
    <path d="M15 25 L23.5 20 L32 25 L40.5 20 L49 25 L32 35Z" fill="#b3a9ee"/>
    <g stroke="none">
      <path d="M32 15 L40.5 20 L32 25 L23.5 20Z" fill="#2b2741"/>
      <path d="M23.5 20 L32 15 L32 18.5 L26.5 21.75Z" fill="#4b4190"/>
      <path d="M32 15 L40.5 20 L37.5 21.75 L32 18.5Z" fill="#7a6ec4"/>
    </g>
    <!-- the plate on its way in -->
    <path d="M23.5 9 L32 14 L32 16.5 L23.5 11.5Z" fill="#7a6ec4"/>
    <path d="M32 14 L40.5 9 L40.5 11.5 L32 16.5Z" fill="#4b4190"/>
    <path d="M32 4 L40.5 9 L32 14 L23.5 9Z" fill="#e7e5fe"/>
    <g stroke="none" fill="#161826">
      <circle cx="19" cy="32" r="1"/>
      <circle cx="28" cy="50" r="1"/>
      <circle cx="44.8" cy="31" r="1"/>
    </g>
  </g>
</svg>
