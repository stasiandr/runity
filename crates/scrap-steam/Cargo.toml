[package]
name = "scrap-steam"
description = "scrap's Steam: lobbies, invites through friends and peer-to-peer through NAT, as a transport of the network module. Links Valve's SDK and needs the Steam client running."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
scrap-core = { path = "../scrap-core" }
scrap-net = { path = "../scrap-net" }
tracing = "0.1.44"

# The SDK only where a Steam client runs; a phone's or a browser's build
# gets the same API without it (src/absent.rs).
[target.'cfg(not(any(target_os = "ios", target_os = "android", target_arch = "wasm32")))'.dependencies]
steamworks = "0.13"
