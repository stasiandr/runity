[package]
name = "scrap-soft"
description = "scrap's soft things: particles held by constraints and solved by XPBD — ropes, cables and chains as Cosserat rods, and after them cloth, hair and soft bodies. Headless: it hands out points and geometry, the render draws them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
scrap-core = { path = "../scrap-core" }
scrap-geometry = { path = "../scrap-geometry" }
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
ron = "0.12.2"
