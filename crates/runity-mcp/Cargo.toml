[package]
name = "runity-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The editor, for an agent: an MCP server over the editor's session. Every
# operation a person has in the editor, an agent has here, headless — and
# it sees the frame, because a scene edited blind is a scene edited wrong.
[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
ron = "0.12.2"
runity = { version = "0.1.0", path = "../runity" }
runity-import = { version = "0.1.0", path = "../runity-import" }
runity-cli = { version = "0.1.0", path = "../runity-cli" }
runity-editor = { version = "0.1.0", path = "../runity-editor" }
runity-gen = { version = "0.1.0", path = "../runity-gen", optional = true }
serde_json = "1.0.151"

# Modules the server carries. Each is one line to switch off, and takes its
# tools and its dependencies out with it (DNA, postulate 3).
[features]
default = ["gen"]
# Draft models from a neural network (`runity-gen`): `generate`, `generations`.
gen = ["dep:runity-gen"]

[[bin]]
name = "runity-mcp"
path = "src/main.rs"
