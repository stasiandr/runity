[package]
name = "runity-fluid"
description = "runity's fluids on grids: MPM for water, snow, sand and jelly (with PIC/FLIP transfers), shallow water, an FFT ocean, ripples, smoke and fire on a sparse grid, and snow that keeps footprints. Headless: it hands out surfaces, particles and densities; the facade draws them and floats bodies on them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
runity-core = { path = "../runity-core" }
runity-geometry = { path = "../runity-geometry" }
runity-soft = { path = "../runity-soft" }
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
ron = "0.12.2"
