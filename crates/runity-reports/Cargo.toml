[package]
name = "runity-reports"
description = "runity's reports: crashes sent to Sentry and play reported to GameAnalytics, with the player's consent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
runity-core = { path = "../runity-core" }
base64 = "0.22"
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
