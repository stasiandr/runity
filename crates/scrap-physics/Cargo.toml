[package]
name = "scrap-physics"
description = "scrap's physics: a line's body, collider and joints, and the simulation of them on rapier. With the `rapier` feature off, only the fields: a scene with bodies still opens, reads and saves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
scrap-core = { path = "../scrap-core" }
scrap-geometry = { path = "../scrap-geometry" }
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"
rapier3d = { version = "0.36.0", optional = true, features = ["enhanced-determinism"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

[features]
default = ["rapier"]
# The simulation itself. Off leaves the fields and components, which is
# what the editor needs to show and save a body without simulating it.
rapier = ["dep:rapier3d"]

[dev-dependencies]
ron = "0.12.2"
