[package]
name = "runity-input"
description = "runity's input actions: named actions bound to keys, buttons and sticks, read from input.ron and reloaded — the Input System's actions over the core's device events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
runity-core = { path = "../runity-core" }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
tracing = "0.1.44"
