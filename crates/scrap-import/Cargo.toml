[package]
name = "scrap-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately not a dependency of `scrap`. Everything that knows how to read
# a source format lives here, so the shipped game links none of it: no OBJ
# parser on a phone, no image decoder on the hot path.
[dependencies]
anyhow = "1.0.104"
glam = "0.32"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "import", "names"] }
hound = "3.5.1"
tiff = "0.11"
weezl = "0.1"
miniz_oxide = "0.8"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "tga", "bmp", "tiff"] }
ron = "0.12.2"
scrap = { package = "scrap-engine", version = "0.1.0", path = "../scrap" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tobj = "4.0.5"
yaml-rust2 = "0.10"
intel_tex_2 = "0.5"
rkyv = "0.8"
scrap-core = { path = "../scrap-core" }
astcenc-rs = "0.2"
zstd = "0.13"

[[bin]]
name = "scrap-import"
path = "src/main.rs"

[dev-dependencies]
# The motion matching example opens a window.
scrap = { package = "scrap-engine", version = "0.1.0", path = "../scrap", features = ["desktop-shell"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
rkyv = "0.8"
texture2ddecoder = "0.1.2"
