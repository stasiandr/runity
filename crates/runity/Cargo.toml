[package]
name = "runity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
runity-animation = { path = "../runity-animation", optional = true }
runity-audio = { path = "../runity-audio", default-features = false }
runity-core = { path = "../runity-core" }
runity-shell = { path = "../runity-shell", optional = true }
runity-render = { path = "../runity-render", default-features = false }
runity-steam = { path = "../runity-steam", optional = true }
runity-net = { path = "../runity-net", optional = true }
runity-navigation = { path = "../runity-navigation", optional = true }
runity-discord = { path = "../runity-discord", optional = true }
runity-reports = { path = "../runity-reports", optional = true }
runity-input = { path = "../runity-input", optional = true }
runity-dialogue = { path = "../runity-dialogue", optional = true }
runity-routes = { path = "../runity-routes", optional = true }
runity-spline = { path = "../runity-spline", optional = true }
runity-geometry = { path = "../runity-geometry" }
runity-gpu = { path = "../runity-gpu" }
runity-overlay = { path = "../runity-overlay" }
runity-physics = { path = "../runity-physics", default-features = false }
runity-soft = { path = "../runity-soft", optional = true }
anyhow = "1.0.104"
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"

# Every module is a crate of its own (docs/modules.md); this crate is the
# facade that brings them under one name. A module that can be left out is
# a feature here, so switching one off is one line and takes its
# dependencies out of the build with it (DNA, postulate 3); a module's
# manifest (`module.ron`) names its feature.
[features]
default = [
    "animation", "dialogue", "input", "metalfx", "navigation", "net", "physics", "ray-tracing", "routes", "soft", "spline",
]
# Solid bodies, from rapier. On by default — a battery — and off with
# `default-features = false` for a game that has no use for it.
physics = ["runity-physics/rapier", "runity-net?/physics"]
# Hardware ray tracing in the render, where the device has it: an
# experiment the scene asks for. Off, it is not in the build.
ray-tracing = ["runity-render/ray-tracing"]
# MetalFX upscaling on Apple's GPUs; off, the engine's own upscaler.
metalfx = ["runity-render/metalfx"]
# Skeletons, animator graphs and motion clips.
animation = ["dep:runity-animation"]
# Peers, ownership and sync, parties, LAN; Steam stands on it.
net = ["dep:runity-net"]
# Named input actions, maps and control schemes (input.ron).
input = ["dep:runity-input"]
# Splines and copies grown along them.
spline = ["dep:runity-spline"]
# Entities travelling their routes.
routes = ["dep:runity-routes"]
# Ropes, cables and chains: particles and constraints, solved by XPBD
# (docs/simulation.md).
soft = ["dep:runity-soft"]
# Conversations.
dialogue = ["dep:runity-dialogue"]
# Where things can walk: a grid baked from the physics world.
navigation = ["physics", "dep:runity-navigation"]
# Sound. Off by default and not because it is unfinished: the engine is
# being built on greybox, and a mixer nobody is listening to is a
# dependency, a device to open and a thing to keep compiling. `--features
# audio` brings it back, and CI builds with it so it cannot rot.
audio = ["runity-audio/kira"]
# Steam: lobbies, invites through friends, peer-to-peer through NAT, as a
# transport. Off by default: it links Valve's SDK and does nothing without
# the Steam client running.
steam = ["net", "dep:runity-steam"]
# Crash reports sent to Sentry and play reported to GameAnalytics. Off by
# default: it is the network, TLS and a player's consent, none of which a
# game gets without asking for them.
reports = ["dep:runity-reports"]
# What a player is doing, shown on their Discord profile, through the
# Discord client running beside the game.
discord = ["dep:runity-discord"]
# A plain desktop window, for running the game without the editor. The
# engine does not need it: the editor owns its own window, and on iOS and
# Android the platform does. This is the convenience path, not the
# architecture.
desktop-shell = ["dep:runity-shell"]

[dev-dependencies]
wgpu = "30"
hecs = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png"] }

# The reference scene, rendered headlessly. `cargo run --example scene_shot`.
[[example]]
name = "scene_shot"
path = "examples/scene_shot.rs"

# A window you can walk around in. Needs the shell feature, so it is not
# built by a plain `cargo build`.
[[example]]
name = "walk"
path = "examples/walk.rs"
required-features = ["desktop-shell"]
