[package]
name = "runity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"
pollster = "1.0.1"
rapier3d = "0.26.1"
rkyv = { version = "0.8", features = ["bytecheck"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
subsecond = "0.7.10"
tracing = "0.1.44"
wgpu = "29"
winit = { version = "0.30.13", optional = true }

[features]
default = []
# A plain desktop window, for running the game without a native shell. The
# engine does not need it: on macOS the Swift editor owns the window, on iOS
# and Android the platform does. This is the convenience path, not the
# architecture.
desktop-shell = ["dep:winit"]

[dev-dependencies]
hecs = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png"] }

# The reference scene, rendered headlessly. `cargo run --example scene_shot`.
[[example]]
name = "scene_shot"
path = "examples/scene_shot.rs"
