[package]
name = "runity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "runity: a dependency-free game engine in Rust."

[dependencies]
runity-math = { path = "../runity-math", version = "0.1.0" }
runity-render = { path = "../runity-render", version = "0.1.0" }
runity-gpu = { path = "../runity-gpu", version = "0.1.0" }
runity-platform = { path = "../runity-platform", version = "0.1.0" }
runity-core = { path = "../runity-core", version = "0.1.0" }

# The showcase keeps its unit tests where the convention puts them — at the
# bottom of the file they cover — so `cargo test` has to run them.
[[example]]
name = "smallworld"
path = "examples/smallworld.rs"
test = true

# Valley's game color lives in code, not in the engine crates (see
# examples/valley/look.rs); its unit tests run the same way smallworld's do.
[[example]]
name = "valley-look"
path = "examples/valley/look.rs"
test = true

# The loading side of the valley's content, and the checklist its committed
# models and atlas have to pass — same arrangement, tests in the file.
[[example]]
name = "valley-assets"
path = "examples/valley/assets.rs"
test = true
