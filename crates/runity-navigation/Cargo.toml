[package]
name = "runity-navigation"
description = "runity's navigation: where something can walk and how to get there — a grid baked from the physics module's static colliders, and A* over it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
runity-core = { path = "../runity-core" }
runity-physics = { path = "../runity-physics" }
glam = { version = "0.32", features = ["serde", "bytemuck"] }
hecs = "0.11.0"

[dev-dependencies]
runity-geometry = { path = "../runity-geometry" }
ron = "0.12.2"
