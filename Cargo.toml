# scrap: a game engine built on off-the-shelf crates.
#
# The rule is: take the proven crate, and write our own only where we hit its
# ceiling. It replaced the opposite rule — an engine assembled from `std`
# alone — and `docs/stack.md` records what that cost and bought.
#
# There is no game code here. What the engine is tested against is its own:
# builtin meshes and materials, and an example project in the standard
# layout, `examples/valley/`. `docs/design/` says what the engine is growing
# toward.
[workspace]
resolver = "2"
members = [
    "crates/scrap",
    "crates/scrap-animation",
    "crates/scrap-audio",
    "crates/scrap-character",
    "crates/scrap-cli",
    "crates/scrap-core",
    "crates/scrap-destruction",
    "crates/scrap-dialogue",
    "crates/scrap-discord",
    "crates/scrap-editor",
    "crates/scrap-fluid",
    "crates/scrap-gen",
    "crates/scrap-geometry",
    "crates/scrap-gpu",
    "crates/scrap-import",
    "crates/scrap-input",
    "crates/scrap-mcp",
    "crates/scrap-navigation",
    "crates/scrap-net",
    "crates/scrap-overlay",
    "crates/scrap-physics",
    "crates/scrap-render",
    "crates/scrap-reports",
    "crates/scrap-routes",
    "crates/scrap-shell",
    "crates/scrap-soft",
    "crates/scrap-spline",
    "crates/scrap-steam",
    "crates/scrap-studio",
    "crates/scrap-ui",
    "crates/scrap-wires",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stasiandr/runity"

[workspace.dependencies]
scrap = { package = "scrap-engine", path = "crates/scrap", version = "0.1.0" }
scrap-editor = { path = "crates/scrap-editor", version = "0.1.0" }
scrap-import = { path = "crates/scrap-import", version = "0.1.0" }

# Release builds keep debug info: a profiler that cannot name a frame is
# worth nothing, and Tracy wants symbols.
[profile.release]
opt-level = 3
debug = 1

# Dependencies go to full optimization so that wgpu and rapier are not the
# reason a debug build crawls, while our own crates stay at opt-level 0 and
# keep compiling fast.
#
# Line tables only, not full debug info: a panic still names the file and
# line, and a debug binary is a third the size and links a third faster —
# the link is most of an incremental rebuild (DNA, postulate 1). A new
# project's game crate uses the same settings, so the two share builds.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# ron 0.12.2 scans the rest of the file for ".." at every number it skips
# over untyped (a scene's components, kept raw): quadratic, half a second
# of Dacha's start. Fixed upstream (ron-rs/ron#608), not yet
# released; pinned to that and nothing after it. A game's own workspace
# needs the same lines.
[patch.crates-io]
ron = { git = "https://github.com/ron-rs/ron", rev = "72134854bb7d3a61b40c48addd69e256e1f7fe18" }
